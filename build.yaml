# Build matrix — Charybdis FULL (4x6) branch.
#
# BT split only for now. Standard dongle + Prospector dongle shields still
# carry the 3x6 Mini matrix on this branch and must be ported to 4x6 before
# they can be re-enabled here (tracked as follow-up work).

board: [ nice_nano//zmk ]

include:

  - name: settings_reset
    board: nice_nano//zmk
    shield: settings_reset

  - name: bt
    board: nice_nano//zmk
    shield:
      - charybdis_left_bt
      - charybdis_right_bt
    keymap:
      - charybdis
