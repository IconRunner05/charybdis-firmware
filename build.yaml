# Build matrix describing every board/shield/keymap combo to build.
# Each entry under `include` becomes a single matrix item in CI and
# the local build script.
#
# Trimmed to the firmware actually in use:
#   - settings_reset
#   - Bluetooth split (nice_nano, qwerty layout)
#   - Prospector Xiao BLE dongle WITH APDS9960 ambient light sensor (qwerty)

board: [ nice_nano//zmk ]

include:

# ── Reset Firmware ────────────────────────────────────────────────────────────
  - name: settings_reset
    board: nice_nano//zmk
    shield: settings_reset

# ── Bluetooth (BT) Split ──────────────────────────────────────────────────────
  - name: bt
    board: nice_nano//zmk
    shield:
      - charybdis_left_bt
      - charybdis_right_bt
    keymap:
      - qwerty

# ── Prospector Xiao BLE Dongle w/ APDS9960 ambient light sensor ────────────────
  # Prospector supports any Waveshare screen with the ST7789V2 driver IC
  # (touch SKU 27057 / non-touch SKU 24382).
  # Layout is Operator; swap dongle_prospector_layouts/*.conf to change it.
  # Radii-only color themes: add a dongle_prospector_themes/*.overlay.
  # NOTE: the two keyboard halves build on nice_nano; only the dongle central
  # is the Xiao BLE board.
  - name: dongle_prospector_xiao_sensor
    board: xiao_ble//zmk
    keymap:
      - qwerty
    builds:
      - shield: charybdis_left_dongle
        board: nice_nano//zmk
      - shield: charybdis_right_dongle
        board: nice_nano//zmk
      - shield: "charybdis_dongle prospector_adapter"
        extra_conf_files:
          - dongle_prospector/dongle_prospector_common.conf
          - dongle_prospector_layouts/dongle_prospector_layout_operator.conf
          - dongle_prospector/dongle_prospector_sensor.conf
